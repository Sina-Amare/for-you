<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for you</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="open it when you have a quiet minute">
<meta property="og:title" content="for you">
<meta property="og:description" content="open it when you have a quiet minute">
<meta property="og:url" content="https://sina-amare.github.io/for-you/">
<meta property="og:image" content="https://sina-amare.github.io/for-you/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e0a08">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<!-- ?v= is stamped by tools/build.mjs: a new address per build, so a phone never runs yesterday's code -->
<link rel="stylesheet" href="style.css?v=232f926f">
<script type="importmap">{"imports":{"./app.js":"./app.js?v=232f926f","./lock.js":"./lock.js?v=232f926f","./sound.js":"./sound.js?v=232f926f","./gallery.js":"./gallery.js?v=232f926f"}}</script>
<script type="module">import './app.js'</script>
</head>
<body>
<div id="wash" aria-hidden="true"><div class="wl"><img alt=""></div><div class="wl"><img alt=""></div></div>
<div id="orsi" aria-hidden="true"><div class="pane p1"><i></i></div><div class="pane p2"><i></i></div><div class="pane p3"><i></i></div><div class="pane p4"><i></i></div><div class="pane p5"><i></i></div></div>

<main id="app">
  <section id="s-gate" class="screen">
    <div class="gate-in">
      <svg id="win" class="win" viewBox="0 0 200 290" aria-hidden="true"></svg>
      <p class="label" id="g-label" dir="auto"></p>
      <p class="g-intro" id="g-intro" dir="auto"></p>
      <h1 class="g-q" id="g-q" dir="auto"></h1>
      <form id="g-form" autocomplete="off" novalidate>
        <input id="answer" dir="auto" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-labelledby="g-q">
        <button id="open" type="submit" class="go"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
      </form>
      <p class="g-wrong" id="g-wrong" dir="auto" aria-live="polite"></p>
      <p class="g-hint" id="g-hint" dir="auto" aria-live="polite"></p>
      <div class="g-verse" id="g-verse"><p class="label g-vlabel" id="g-vlabel" dir="auto"></p><p class="g-vtext" id="g-vtext" lang="fa" dir="rtl"></p><p class="g-ven" id="g-ven" dir="auto"></p></div>
    </div>
  </section>

  <section id="s-opening" class="screen">
    <div class="epi">
      <p class="verse" lang="fa" dir="rtl"><span class="m" dir="rtl"></span><span class="m" dir="rtl"></span></p>
      <p class="label poet" dir="auto"></p>
      <p class="epi-en" dir="auto"></p>
    </div>
    <div class="tblock">
      <h1 class="title" dir="auto"></h1>
      <p class="label odate" dir="auto"></p>
      <div class="olines"></div>
    </div>
    <button class="go begin" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
  </section>

  <section id="s-story" class="screen">
    <div id="stage">
      <header class="topbar"><div class="segs"></div><p class="label chapter"><span class="num"></span><span class="ct" dir="auto"></span></p></header>
      <div class="scene">
        <div class="frame">
          <div class="arch">
            <div class="slots">
              <div class="ph"><img class="soft" alt=""><img class="sharp" alt=""></div>
              <div class="ph b"><img class="soft" alt=""><img class="sharp" alt=""></div>
            </div>
            <div class="haze"></div>
            <canvas id="fog"></canvas>
            <div class="bloom"></div>
            <div class="shade"></div>
          </div>
          <div class="wipehint" aria-hidden="true"><span dir="auto"></span><svg viewBox="0 0 120 24"><path d="M6 15c14-9 22-9 30-2s16 9 26 1 18-10 28-3 14 6 24 1"/></svg></div>
        </div>
        <div class="wall">
          <p class="label placard"></p>
          <div class="lines" aria-live="polite"></div>
        </div>
      </div>
      <p class="taphint" dir="auto"></p>
    </div>
  </section>

  <section id="s-interlude" class="screen">
    <div class="il">
      <p class="label il-label" dir="auto"></p>
      <h2 class="il-q" dir="auto"></h2>
      <div class="answers">
        <button id="yes" type="button"><span dir="auto"></span></button>
        <span class="noslot"><button id="no" type="button" aria-live="polite"><span dir="auto"></span></button></span>
      </div>
      <div class="il-after lines" aria-live="polite"></div>
      <button class="go il-cont" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
    </div>
    <div class="arena" aria-hidden="true"></div>
    <div class="shards" aria-hidden="true"></div>
  </section>

  <section id="s-hold" class="screen">
    <div class="holdwrap">
      <div class="frame">
        <div class="arch">
          <div class="slots"><div class="ph"><img class="soft" alt=""><img class="sharp" alt=""></div></div>
          <div class="haze"></div>
          <div class="glow"></div>
          <div class="shade"></div>
        </div>
        <button id="hold" type="button"><i class="pulse"></i><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="trk" cx="42" cy="42" r="30"/><circle class="prog" cx="42" cy="42" r="30"/></svg><i class="dot"></i></button>
      </div>
      <div class="wall">
        <p class="hold-prompt" dir="auto"></p>
        <div class="lines hold-lines" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section id="s-letter" class="screen">
    <article id="letter">
      <svg class="emboss" viewBox="0 0 160 84" aria-hidden="true"></svg>
      <div class="ink" tabindex="0"></div>
    </article>
    <button class="go l-cont" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
  </section>

  <section id="s-menu" class="screen">
    <div class="menu-in">
      <p class="label" id="m-back" dir="auto"></p>
      <h1 class="m-title" id="m-title" dir="auto"></h1>
      <div class="m-btns">
        <button id="m-again" class="go" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
        <button id="m-gallery" class="go" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
      </div>
      <p class="label m-chap-label" id="m-chap-label" dir="auto"></p>
      <nav class="m-chapters" id="m-chapters"></nav>
    </div>
  </section>

  <section id="s-credits" class="screen">
    <div id="credits"><div class="roll"></div></div>
    <div class="end">
      <div class="coda"><p class="coda-v" id="coda-v" lang="fa" dir="rtl"></p><p class="label coda-poet" id="coda-poet" dir="auto"></p><p class="coda-en" id="coda-en" dir="auto"></p></div>
      <p class="theend" dir="auto"></p>
      <div class="endbtns">
        <button id="to-gallery" class="go" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
        <button id="again" class="go quiet" type="button"><span dir="auto"></span></button>
      </div>
    </div>
  </section>

  <section id="s-gallery" class="screen">
    <div class="gscroll">
      <header class="ghead">
        <div class="gtext">
          <h1 class="gtitle" dir="auto"></h1>
          <p class="gsub" dir="auto"></p>
        </div>
        <div class="gact">
          <button id="add" type="button"><span class="addarch" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span><span class="addt" dir="auto"></span></button>
          <p class="goff" dir="auto" hidden></p>
          <p class="gempty" dir="auto" hidden></p>
        </div>
      </header>
      <div class="grid"></div>
    </div>

    <div id="lightbox" role="dialog" aria-modal="true" hidden>
      <button id="close" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l12 12M16 4 4 16"/></svg></button>
      <div class="lb-stage">
        <div class="lb-ph"><img class="soft" alt=""><img class="sharp" alt=""><i class="haze"></i></div>
      </div>
      <div class="lb-meta">
        <p class="lb-cap" dir="auto"></p>
        <p class="label lb-sub" dir="auto"></p>
        <div class="lb-del">
          <button class="go del" type="button"><span dir="auto"></span></button>
          <p class="lb-confirm" dir="auto"></p>
          <button class="go del-yes" type="button"><span dir="auto"></span></button>
          <button class="go quiet del-no" type="button"><span dir="auto"></span></button>
        </div>
      </div>
      <button class="lb-nav lb-prev" type="button"><svg viewBox="0 0 12 24" aria-hidden="true"><path d="M10 2 2 12l8 10"/></svg></button>
      <button class="lb-nav lb-next" type="button"><svg viewBox="0 0 12 24" aria-hidden="true"><path d="M2 2l8 10-8 10"/></svg></button>
    </div>

    <div class="sheet-back" hidden></div>
    <div class="sheet" role="dialog" aria-modal="true" hidden>
      <button class="sheet-x" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l12 12M16 4 4 16"/></svg></button>
      <label class="pick" for="file">
        <span class="pick-arch"><img class="prev" alt=""><i class="haze"></i><i class="lift"></i><svg class="plus" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></span>
        <span class="pick-t" dir="auto"></span>
      </label>
      <input id="file" type="file" accept="image/*">
      <span class="cap"><input id="caption" type="text" dir="auto" autocomplete="off" enterkeyhint="done" maxlength="140" placeholder=" "><span class="cap-ph" dir="auto" aria-hidden="true"></span></span>
      <div class="from"><span class="label from-l" dir="auto"></span><button type="button" data-by="her" dir="auto"></button><button type="button" data-by="me" dir="auto"></button></div>
      <button id="send" class="go" type="button"><span dir="auto"></span><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M23.5 1.2 28 5l-4.5 3.8"/></svg></button>
      <p class="sheet-status" dir="auto" aria-live="polite"></p>
    </div>
  </section>
</main>

<div id="flood" aria-hidden="true"></div>
<p id="welcome" dir="auto" aria-live="polite"></p>
<div id="vignette" aria-hidden="true"></div>
<button id="skip" class="go" type="button" hidden><span dir="auto"></span></button>
<div id="chrome">
  <button id="lang" type="button"></button>
  <button id="mute" type="button" aria-pressed="false"><span class="bars"><i></i><i></i><i></i></span></button>
</div>
<audio id="music" loop playsinline preload="none"></audio>
</body>
</html>
